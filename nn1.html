<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>شبیه‌ساز شبکه عصبی — گیت‌های منطقی</title>
<style>
  body { font-family: Tahoma, sans-serif; margin: 16px; background:#f7f9fb; color:#222; }
  h2 { margin-top:0; font-size:18px; }
  h3 { margin:0 0 8px; font-size:14px; text-align:center; color:#444; }

  .controls { display:flex; gap:16px; flex-wrap:wrap; align-items:center; margin-bottom:12px; font-size:14px; }
  input[type=range] { vertical-align:middle; }
  select { padding:4px 8px; border-radius:5px; border:1px solid #bbb; font-size:14px; }
  .val { font-weight:bold; color:#2b7a78; }

  button { padding:7px 16px; border:none; border-radius:6px; background:#2b7a78; color:#fff; cursor:pointer; font-size:14px; }
  button:disabled { background:#9bb; cursor:not-allowed; }
  button.secondary { background:#e8a87c; }
  button.danger { background:#c0392b; }

  .hint { font-size:12px; color:#666; margin-bottom:10px; padding:6px 10px; background:#fff8e1; border-radius:5px; border-right:3px solid #e8a87c; }

  .canvasWrap { display:flex; gap:16px; flex-wrap:wrap; }
  .panel { background:#fff; border-radius:8px; padding:10px; box-shadow:0 1px 4px rgba(0,0,0,.08); }

  canvas { display:block; border-radius:4px; }

  .legend { font-size:12px; margin-top:8px; text-align:center; color:#555; }
  .legend span { display:inline-block; width:12px; height:12px; border-radius:2px; vertical-align:middle; margin:0 4px; }

  #results { margin-top:14px; font-size:13px; line-height:1.8; }
  .ok { color:#1a7f37; font-weight:bold; }
  .bad { color:#c0392b; font-weight:bold; }
  code { background:#eef; padding:1px 5px; border-radius:3px; }

  /* نوار پیشرفت */
  #progressWrap { margin:10px 0; display:none; }
  #progressBar { height:10px; background:#2b7a78; width:0%; border-radius:5px; transition:width .1s; }
  #progressOuter { height:10px; background:#e0e6e6; border-radius:5px; overflow:hidden; }

  /* جدول نقش‌ها */
  table.roles { width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; background:#fff; }
  table.roles th, table.roles td { border:1px solid #ddd; padding:6px 8px; text-align:center; }
  table.roles th { background:#eef4f4; }
  .roleCard { margin-top:8px; padding:8px; background:#fff; border-radius:6px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .roleCard h4 { margin:0 0 6px; font-size:13px; }
  .neuronCanvas { display:block; margin:6px auto 0; }
</style>
</head>
<body>
  <h2>شبیه‌ساز شبکه عصبی — گیت‌های منطقی</h2>

  <!-- انتخاب گیت -->
  <div class="controls">
    <label>گیت منطقی:
      <select id="gate">
        <option value="XOR" selected>XOR</option>
        <option value="XNOR">XNOR</option>
        <option value="AND">AND</option>
        <option value="OR">OR</option>
        <option value="NAND">NAND</option>
        <option value="NOR">NOR</option>
      </select>
    </label>
  </div>

  <div class="hint" id="gateHint"></div>

  <!-- کنترل‌ها -->
  <div class="controls">
    <label>نرون مخفی: <span class="val" id="hVal">2</span>
      <input type="range" id="hidden" min="1" max="6" value="2">
    </label>
    <label>نرخ یادگیری: <span class="val" id="lrVal">0.5</span>
      <input type="range" id="lr" min="0.05" max="2" step="0.05" value="0.5">
    </label>
    <label>دورها: <span class="val" id="epVal">20000</span>
      <input type="range" id="epochs" min="1000" max="50000" step="1000" value="20000">
    </label>
    <button id="run">آموزش و رسم</button>
    <button id="stop" class="danger" disabled>توقف</button>
    <button id="random" class="secondary">تصادفی جدید</button>
    <button id="save" class="secondary">ذخیره وزن‌ها</button>
    <button id="load" class="secondary">بارگذاری وزن‌ها</button>
    <input type="file" id="loadFile" accept=".json" style="display:none">
  </div>

  <!-- نوار پیشرفت -->
  <div id="progressWrap">
    <div id="progressOuter"><div id="progressBar"></div></div>
    <div style="font-size:12px; color:#555; margin-top:3px;" id="progressText"></div>
  </div>

  <!-- نمودارها -->
  <div class="canvasWrap">
    <div class="panel">
      <h3>مرز تصمیم‌گیری (کل صفحه)</h3>
      <canvas id="grid" width="360" height="360"></canvas>
      <div class="legend">
        <span style="background:#2b7a78"></span>خروجی ≈ 1
        <span style="background:#e8a87c"></span>خروجی ≈ 0
        <span style="background:#fff;border:1px solid #999"></span>مرز
      </div>
    </div>

    <div class="panel">
      <h3>چهار نقطه گیت</h3>
      <canvas id="points" width="360" height="360"></canvas>
      <div class="legend">
        <span style="background:#1a7f37;border-radius:50%"></span>هدف 1
        <span style="background:#c0392b;border-radius:50%"></span>هدف 0
      </div>
    </div>

    <div class="panel">
      <h3>نمودار Loss</h3>
      <canvas id="lossChart" width="360" height="200"></canvas>
      <div class="legend">کاهش خطا در طول آموزش</div>
    </div>
  </div>

  <!-- نقش نورون‌ها -->
  <div class="panel" id="rolesPanel" style="margin-top:16px; display:none;">
    <h3>نقش نورون‌ها (تشخیص خودکار)</h3>
    <div id="rolesContent"></div>
  </div>

  <!-- نتایج -->
  <div id="results">منتظر اجرا...</div>

<script>
/* ========== توابع پایه ========== */
const sigmoid  = x => 1 / (1 + Math.exp(-x));
const dsigmoid = o => o * (1 - o);

const inputs  = [[0,0],[0,1],[1,0],[1,1]]; // ترتیب نقاط
const $ = id => document.getElementById(id);

/* ========== جدول درستی گیت‌ها ========== */
const GATES = {
  AND:  [0,0,0,1],
  OR:   [0,1,1,1],
  NAND: [1,1,1,0],
  NOR:  [1,0,0,0],
  XOR:  [0,1,1,0],
  XNOR: [1,0,0,1],
};

/* گیت‌های خطی جداپذیر */
const LINEAR_GATES = ['AND','OR','NAND','NOR'];

/* ========== تشخیص نقش از روی بیت‌ها ==========
   الگوهای بیتی به ترتیب [00,01,10,11] */
const ROLE_PATTERNS = {
  '0,0,0,0': 'همیشه 0',
  '1,1,1,1': 'همیشه 1',
  '0,0,0,1': 'AND',
  '0,1,1,1': 'OR',
  '1,1,1,0': 'NAND',
  '1,0,0,0': 'NOR',
  '0,1,1,0': 'XOR',
  '1,0,0,1': 'XNOR',
  '0,0,1,1': 'x0',
  '0,1,0,1': 'x1',
  '1,1,0,0': 'NOT x0',
  '1,0,1,0': 'NOT x1',
  '0,1,0,0': 'x0 ∧ ¬x1',
  '0,0,1,0': 'x1 ∧ ¬x0',
  '1,0,0,1': 'XNOR',
  '1,1,0,1': 'x0 ∨ ¬x1',
  '1,0,1,1': 'x1 ∨ ¬x0',
};

function detectRole(bits) {
  const key = bits.join(',');
  return ROLE_PATTERNS[key] || 'ناشناخته';
}

/* ========== seed تصادفی ========== */
let seed = Date.now() % 100000;
function rand() {
  // LCG ساده برای تکرارپذیری
  seed = (seed * 9301 + 49297) % 233280;
  return (seed / 233280) * 2 - 1;
}

/* ========== متغیرهای کنترل آموزش ========== */
let stopRequested = false;
let isTraining = false;

/* ========== آموزش شبکه (chunk-based) ========== */
async function trainNetwork(H, lr, EPOCHS, targets, onProgress) {
  // مقداردهی وزن‌ها
  let W1 = Array.from({length:H}, () => [rand(), rand()]);
  let b1 = Array(H).fill(0);
  let W2 = Array(H).fill(0).map(rand);
  let b2 = 0;

  const CHUNK = 500; // هر تکه ۵۰۰ دور
  let lossHistory = [];

  for (let ep = 0; ep < EPOCHS; ep += CHUNK) {
    // یک تکه آموزش
    for (let k = 0; k < CHUNK && ep + k < EPOCHS; k++) {
      let epochLoss = 0;
      for (let n = 0; n < inputs.length; n++) {
        const x = inputs[n], target = targets[n];

        // --- forward ---
        const hOut = new Array(H);
        for (let h = 0; h < H; h++) {
          let s = b1[h];
          for (let i = 0; i < 2; i++) s += W1[h][i] * x[i];
          hOut[h] = sigmoid(s);
        }
        let sOut = b2;
        for (let h = 0; h < H; h++) sOut += W2[h] * hOut[h];
        const out = sigmoid(sOut);

        // --- خطا ---
        const err = target - out;
        epochLoss += err * err;

        // --- backward ---
        const dOut = err * dsigmoid(out);
        const dH = new Array(H);
        for (let h = 0; h < H; h++) dH[h] = dOut * W2[h] * dsigmoid(hOut[h]);

        for (let h = 0; h < H; h++) {
          W2[h] += lr * dOut * hOut[h];
          for (let i = 0; i < 2; i++) W1[h][i] += lr * dH[h] * x[i];
          b1[h] += lr * dH[h];
        }
        b2 += lr * dOut;
      }
      lossHistory.push(epochLoss / inputs.length);
    }

    // به مرورگر فرصت بده
    await new Promise(r => setTimeout(r, 0));

    // progress
    if (onProgress) onProgress(Math.min(ep + CHUNK, EPOCHS), EPOCHS);

    // توقف؟
    if (stopRequested) break;
  }

  return {W1, b1, W2, b2, H, lossHistory};
}

/* ========== پیش‌بینی ========== */
function predict(net, x0, x1) {
  const {W1, b1, W2, b2, H} = net;
  const hOut = new Array(H);
  for (let h = 0; h < H; h++) {
    let s = b1[h];
    s += W1[h][0]*x0 + W1[h][1]*x1;
    hOut[h] = sigmoid(s);
  }
  let sOut = b2;
  for (let h = 0; h < H; h++) sOut += W2[h] * hOut[h];
  return sigmoid(sOut);
}

/* خروجی یک نورون مخفی خاص */
function hiddenOutput(net, h, x0, x1) {
  let s = net.b1[h];
  s += net.W1[h][0]*x0 + net.W1[h][1]*x1;
  return sigmoid(s);
}

/* ========== رسم مرز تصمیم‌گیری ========== */
function drawGrid(net) {
  const c = $('grid'), ctx = c.getContext('2d');
  const W = c.width, Hh = c.height;
  const img = ctx.createImageData(W, Hh);

  for (let py = 0; py < Hh; py++) {
    for (let px = 0; px < W; px++) {
      const x0 = px / (W - 1);
      const x1 = 1 - py / (Hh - 1);
      const out = predict(net, x0, x1);

      const t = out;
      const r = Math.round(232 + (43 - 232) * t);
      const g = Math.round(168 + (122 - 168) * t);
      const b = Math.round(124 + (120 - 124) * t);

      const isBorder = Math.abs(out - 0.5) < 0.012;

      const idx = (py * W + px) * 4;
      if (isBorder) {
        img.data[idx] = 60; img.data[idx+1] = 60; img.data[idx+2] = 60; img.data[idx+3] = 255;
      } else {
        img.data[idx] = r; img.data[idx+1] = g; img.data[idx+2] = b; img.data[idx+3] = 255;
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}

/* ========== رسم چهار نقطه ========== */
function drawPoints(targets) {
  const c = $('points'), ctx = c.getContext('2d');
  const W = c.width, Hh = c.height;
  ctx.clearRect(0, 0, W, Hh);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, Hh);
  ctx.strokeStyle = '#eee'; ctx.lineWidth = 1;
  for (let i = 0; i <= 10; i++) {
    const t = i / 10;
    ctx.beginPath(); ctx.moveTo(t*W, 0); ctx.lineTo(t*W, Hh); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, t*Hh); ctx.lineTo(W, t*Hh); ctx.stroke();
  }
  ctx.strokeStyle = '#aaa';
  ctx.beginPath(); ctx.moveTo(0, Hh); ctx.lineTo(W, Hh); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, Hh); ctx.stroke();

  inputs.forEach((x, i) => {
    const px = x[0] * (W - 20) + 10;
    const py = (1 - x[1]) * (Hh - 20) + 10;
    ctx.beginPath();
    ctx.arc(px, py, 14, 0, Math.PI * 2);
    ctx.fillStyle = targets[i] === 1 ? '#1a7f37' : '#c0392b';
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px Tahoma';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`${x[0]},${x[1]}`, px, py);
  });
}

/* ========== رسم کانواس کوچک برای نقش یک نورون ========== */
function drawNeuronRole(canvasId, net, h) {
  const c = $(canvasId);
  if (!c) return;
  const ctx = c.getContext('2d');
  const W = c.width, Hh = c.height;
  const img = ctx.createImageData(W, Hh);

  for (let py = 0; py < Hh; py++) {
    for (let px = 0; px < W; px++) {
      const x0 = px / (W - 1);
      const x1 = 1 - py / (Hh - 1);
      const out = hiddenOutput(net, h, x0, x1);

      const t = out;
      const r = Math.round(232 + (43 - 232) * t);
      const g = Math.round(168 + (122 - 168) * t);
      const b = Math.round(124 + (120 - 124) * t);

      const isBorder = Math.abs(out - 0.5) < 0.02;

      const idx = (py * W + px) * 4;
      if (isBorder) {
        img.data[idx] = 60; img.data[idx+1] = 60; img.data[idx+2] = 60; img.data[idx+3] = 255;
      } else {
        img.data[idx] = r; img.data[idx+1] = g; img.data[idx+2] = b; img.data[idx+3] = 255;
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}

/* ========== رسم نمودار Loss ========== */
function drawLossChart(history) {
  const c = $('lossChart'), ctx = c.getContext('2d');
  const W = c.width, Hh = c.height;
  ctx.clearRect(0, 0, W, Hh);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, Hh);

  if (!history || history.length === 0) return;

  // نمونه‌برداری برای سرعت (حداکثر ۲۰۰ نقطه)
  const step = Math.max(1, Math.floor(history.length / 200));
  const sampled = [];
  for (let i = 0; i < history.length; i += step) sampled.push(history[i]);

  const maxLoss = Math.max(...sampled, 0.0001);

  // محورها
  ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = (i/4) * (Hh - 20) + 10;
    ctx.beginPath(); ctx.moveTo(30, y); ctx.lineTo(W - 10, y); ctx.stroke();
  }
  ctx.strokeStyle = '#aaa';
  ctx.beginPath(); ctx.moveTo(30, 10); ctx.lineTo(30, Hh - 10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(30, Hh - 10); ctx.lineTo(W - 10, Hh - 10); ctx.stroke();

  // برچسب‌ها
  ctx.fillStyle = '#666'; ctx.font = '10px Tahoma'; ctx.textAlign = 'right';
  ctx.fillText(maxLoss.toFixed(2), 28, 15);
  ctx.fillText('0', 28, Hh - 10);

  // خط loss
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  sampled.forEach((v, i) => {
    const x = 30 + (i / (sampled.length - 1)) * (W - 40);
    const y = (Hh - 10) - (v / maxLoss) * (Hh - 20);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
}

/* ========== تشخیص نقش نورون‌ها ========== */
function detectNeuronRoles(net, targets) {
  const H = net.H;
  const rows = [];

  // نورون‌های مخفی
  for (let h = 0; h < H; h++) {
    const outs = inputs.map(x => hiddenOutput(net, h, x[0], x[1]));
    const bits = outs.map(o => o >= 0.5 ? 1 : 0);
    rows.push({
      name: `نورون مخفی ${h}`,
      outs, bits, role: detectRole(bits)
    });
  }

  // نورون خروجی
  const outVals = inputs.map(x => predict(net, x[0], x[1]));
  const outBits = outVals.map(o => o >= 0.5 ? 1 : 0);
  rows.push({
    name: 'نورون خروجی',
    outs: outVals, bits: outBits, role: detectRole(outBits)
  });

  return rows;
}

/* ========== نمایش جدول نقش‌ها ========== */
function renderRoles(net, targets, gateName) {
  const panel = $('rolesPanel');
  const content = $('rolesContent');
  const rows = detectNeuronRoles(net, targets);

  let html = '<table class="roles"><tr><th>نورون</th><th>خروجی‌ها</th><th>بیت‌ها</th><th>نقش</th></tr>';
  rows.forEach(r => {
    html += `<tr>
      <td>${r.name}</td>
      <td>[${r.outs.map(o => o.toFixed(2)).join(', ')}]</td>
      <td>[${r.bits.join(', ')}]</td>
      <td><b>${r.role}</b></td>
    </tr>`;
  });
  html += '</table>';

  // تفسیر وزن‌های W2
  if (net.H === 2) {
    const w0 = net.W2[0], w1 = net.W2[1];
    html += `<div style="margin-top:10px; font-size:13px;">
      <b>وزن‌های نورون خروجی:</b><br>
      W2[0] = <code>${w0.toFixed(3)}</code> &nbsp;|&nbsp; W2[1] = <code>${w1.toFixed(3)}</code>
    </div>`;
  }

  // کانواس کوچک برای هر نورون مخفی
  html += '<div class="canvasWrap" style="margin-top:12px;">';
  for (let h = 0; h < net.H; h++) {
    html += `<div class="roleCard">
      <h4>نقش نورون مخفی ${h}</h4>
      <canvas id="neuronCanvas${h}" class="neuronCanvas" width="120" height="120"></canvas>
    </div>`;
  }
  html += '</div>';

  content.innerHTML = html;
  panel.style.display = 'block';

  // رسم کانواس‌ها
  for (let h = 0; h < net.H; h++) {
    drawNeuronRole(`neuronCanvas${h}`, net, h);
  }
}

/* ========== راهنمای گیت ========== */
function updateGateHint() {
  const gate = $('gate').value;
  const hint = $('gateHint');
  if (LINEAR_GATES.includes(gate)) {
    hint.textContent = `گیت ${gate} خطی جداپذیر است — با ۱ نورون مخفی هم حل می‌شود.`;
  } else {
    hint.textContent = `گیت ${gate} خطی جداپذیر نیست — حداقل ۲ نورون مخفی لازم است.`;
  }
}

/* ========== به‌روزرسانی اسلایدرها ========== */
$('hidden').oninput = () => $('hVal').textContent = $('hidden').value;
$('lr').oninput     = () => $('lrVal').textContent = $('lr').value;
$('epochs').oninput = () => $('epVal').textContent = $('epochs').value;
$('gate').onchange  = updateGateHint;

/* ========== اجرای آموزش ========== */
async function run() {
  if (isTraining) return;
  isTraining = true;
  stopRequested = false;

  const gate = $('gate').value;
  const targets = GATES[gate];
  const H = +$('hidden').value;
  const lr = +$('lr').value;
  const EPOCHS = +$('epochs').value;

  // قفل دکمه‌ها
  $('run').disabled = true;
  $('stop').disabled = false;
  $('random').disabled = true;
  $('load').disabled = true;
  $('save').disabled = true;

  // نمایش نوار پیشرفت
  $('progressWrap').style.display = 'block';
  $('progressBar').style.width = '0%';
  $('progressText').textContent = 'در حال آموزش...';

  // رسم اولیه نقاط
  drawPoints(targets);

  const startTime = performance.now();

  const net = await trainNetwork(H, lr, EPOCHS, targets, (done, total) => {
    const pct = (done / total) * 100;
    $('progressBar').style.width = pct + '%';
    $('progressText').textContent = `دور ${done} از ${total} (${pct.toFixed(1)}%)`;
  });

  const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);

  // رسم‌ها
  drawGrid(net);
  drawPoints(targets);
  drawLossChart(net.lossHistory);
  renderRoles(net, targets, gate);

  // نتایج نهایی
  let html = `<b>نتیجه (گیت = ${gate}، نرون مخفی = ${H}):</b><br>`;
  let allOk = true;
  inputs.forEach((x, i) => {
    const out = predict(net, x[0], x[1]);
    const ok = Math.abs(out - targets[i]) < 0.3;
    if (!ok) allOk = false;
    html += `${gate}(${x[0]},${x[1]}) = <code>${out.toFixed(4)}</code> ` +
            (ok ? '<span class="ok">✓</span>' : '<span class="bad">✗</span>') + '<br>';
  });
  html += `<br>⏱️ زمان آموزش: ${elapsed} ثانیه<br>`;
  html += allOk
    ? `<br><span class="ok">✅ شبکه گیت ${gate} را یاد گرفت.</span>`
    : `<br><span class="bad">❌ شبکه گیت ${gate} را یاد نگرفت.</span>`;
  $('results').innerHTML = html;

  // آزاد کردن دکمه‌ها
  $('run').disabled = false;
  $('stop').disabled = true;
  $('random').disabled = false;
  $('load').disabled = false;
  $('save').disabled = false;
  isTraining = false;
}

/* ========== دکمه توقف ========== */
$('stop').onclick = () => {
  stopRequested = true;
  $('progressText').textContent = 'در حال توقف...';
};

/* ========== دکمه تصادفی جدید ========== */
$('random').onclick = () => {
  seed = Math.floor(Math.random() * 100000);
  $('results').textContent = 'seed جدید: ' + seed;
};

/* ========== ذخیره وزن‌ها ========== */
let lastNet = null;
// بعد از آموزش، lastNet رو نگه داریم
const originalRun = run;
run = async function() {
  await originalRun();
};

// راه ساده‌تر: در انتهای run، net رو در lastNet ذخیره کنیم
// (چون run رو override کردیم، بهتره مستقیم در خود run این کار رو کنیم)
// --- بازنویسی run با ذخیره‌سازی ---
async function runAndSave() {
  if (isTraining) return;
  isTraining = true;
  stopRequested = false;

  const gate = $('gate').value;
  const targets = GATES[gate];
  const H = +$('hidden').value;
  const lr = +$('lr').value;
  const EPOCHS = +$('epochs').value;

  $('run').disabled = true;
  $('stop').disabled = false;
  $('random').disabled = true;
  $('load').disabled = true;
  $('save').disabled = true;

  $('progressWrap').style.display = 'block';
  $('progressBar').style.width = '0%';
  $('progressText').textContent = 'در حال آموزش...';

  drawPoints(targets);
  const startTime = performance.now();

  const net = await trainNetwork(H, lr, EPOCHS, targets, (done, total) => {
    const pct = (done / total) * 100;
    $('progressBar').style.width = pct + '%';
    $('progressText').textContent = `دور ${done} از ${total} (${pct.toFixed(1)}%)`;
  });

  lastNet = net;
  lastNet.gate = gate;
  lastNet.targets = targets;

  const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);

  drawGrid(net);
  drawPoints(targets);
  drawLossChart(net.lossHistory);
  renderRoles(net, targets, gate);

  let html = `<b>نتیجه (گیت = ${gate}، نرون مخفی = ${H}):</b><br>`;
  let allOk = true;
  inputs.forEach((x, i) => {
    const out = predict(net, x[0], x[1]);
    const ok = Math.abs(out - targets[i]) < 0.3;
    if (!ok) allOk = false;
    html += `${gate}(${x[0]},${x[1]}) = <code>${out.toFixed(4)}</code> ` +
            (ok ? '<span class="ok">✓</span>' : '<span class="bad">✗</span>') + '<br>';
  });
  html += `<br>⏱️ زمان آموزش: ${elapsed} ثانیه<br>`;
  html += allOk
    ? `<br><span class="ok">✅ شبکه گیت ${gate} را یاد گرفت.</span>`
    : `<br><span class="bad">❌ شبکه گیت ${gate} را یاد نگرفت.</span>`;
  $('results').innerHTML = html;

  $('run').disabled = false;
  $('stop').disabled = true;
  $('random').disabled = false;
  $('load').disabled = false;
  $('save').disabled = false;
  isTraining = false;
}

// جایگزینی run
$('run').onclick = runAndSave;

/* ========== ذخیره ========== */
$('save').onclick = () => {
  if (!lastNet) { alert('اول آموزش بده!'); return; }
  const data = {
    W1: lastNet.W1, b1: lastNet.b1,
    W2: lastNet.W2, b2: lastNet.b2,
    H: lastNet.H, gate: lastNet.gate
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `weights_${lastNet.gate}_H${lastNet.H}.json`;
  a.click();
  URL.revokeObjectURL(url);
};

/* ========== بارگذاری ========== */
$('load').onclick = () => $('loadFile').click();
$('loadFile').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      const net = {W1: data.W1, b1: data.b1, W2: data.W2, b2: data.b2, H: data.H};
      lastNet = net;
      lastNet.gate = data.gate;
      lastNet.targets = GATES[data.gate] || [0,1,1,0];

      // اعمال به UI
      $('gate').value = data.gate || 'XOR';
      $('hidden').value = data.H;
      $('hVal').textContent = data.H;
      updateGateHint();

      drawGrid(net);
      drawPoints(lastNet.targets);
      // loss در دسترس نیست
      renderRoles(net, lastNet.targets, lastNet.gate);

      let html = `<b>وزن‌ها بارگذاری شد (گیت = ${lastNet.gate}):</b><br>`;
      inputs.forEach((x, i) => {
        const out = predict(net, x[0], x[1]);
        const ok = Math.abs(out - lastNet.targets[i]) < 0.3;
        html += `${lastNet.gate}(${x[0]},${x[1]}) = <code>${out.toFixed(4)}</code> ` +
                (ok ? '<span class="ok">✓</span>' : '<span class="bad">✗</span>') + '<br>';
      });
      $('results').innerHTML = html;
    } catch (err) {
      alert('خطا در بارگذاری: ' + err.message);
    }
  };
  reader.readAsText(file);
};

/* ========== اجرای اولیه ========== */
updateGateHint();
runAndSave();
</script>
</body>
</html>
